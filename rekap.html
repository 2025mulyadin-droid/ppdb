<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekapitulasi PPDB MI ISLAMADINA</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #0F766E;
            --primary-light: #14B8A6;
            --secondary: #0D9488;
            --accent: #F59E0B;
            --bg-body: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --error: #ef4444;
            --success: #10b981;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Login Screen */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            color: var(--primary);
            font-weight: 700;
        }

        .login-card input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            text-align: center;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-card button:hover {
            background: var(--secondary);
        }

        #loginError {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* Dashboard Layout */
        #adminDashboard {
            display: none;
            padding: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header-title h1 {
            font-size: 1.75rem;
            color: var(--primary);
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid var(--border);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            background: rgba(15, 118, 110, 0.1);
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-info h3 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Search & Actions */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-container {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            background: white;
        }

        .search-container::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.5;
        }

        .btn-print {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            background: white;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-print:hover {
            background: #f1f5f9;
        }

        .btn-print.primary {
            background: var(--primary);
            color: white;
            border: none;
        }

        /* Table Styles */
        .table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            overflow-x: auto;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
            min-width: 1200px;
        }

        thead {
            background: #f8fafc;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 16px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-l {
            background: #dcfce7;
            color: #166534;
        }

        .badge-p {
            background: #fce7f3;
            color: #9d174d;
        }

        .btn-detail {
            background: var(--primary-light);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Detail Modal */
        #detailModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-body {
            background: white;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-content {
            padding: 2rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: #f8fafc;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .detail-section {
            margin-bottom: 10px;
        }

        .detail-section h4 {
            color: var(--primary);
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-item {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 6px;
        }

        .detail-label {
            font-weight: 500;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .detail-value {
            font-weight: 600;
            font-size: 0.85rem;
            text-align: right;
            color: var(--text-main);
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.75rem;
            cursor: pointer;
            line-height: 1;
        }

        /* Table Loader */
        .table-loader {
            padding: 4rem;
            text-align: center;
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Print Header Logo Placeholders */
        .print-only-header {
            display: none;
        }

        /* PRINT LOGIC */
        @media print {
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            #loginScreen,
            .controls,
            .modal-header,
            .modal-footer,
            .btn-close-modal {
                display: none !important;
            }

            /* Case 1: Printing Student Detail */
            body.printing-detail #adminDashboard {
                display: none !important;
            }

            body.printing-detail #detailModal {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                display: block !important;
                background: white !important;
                padding: 0 !important;
                backdrop-filter: none !important;
            }

            body.printing-detail .modal-body {
                box-shadow: none !important;
                max-height: none !important;
                width: 100% !important;
                max-width: none !important;
                border: none !important;
                overflow: visible !important;
            }

            body.printing-detail .modal-content {
                padding: 0.5cm 1cm !important;
                /* Tighter margin to fit 1 page */
            }

            body.printing-detail .print-only-header {
                display: block !important;
                text-align: center;
                margin-bottom: 20px;
                border-bottom: 2px solid #000;
                padding-bottom: 10px;
            }

            body.printing-detail .print-only-header h2 {
                font-size: 1.4rem !important;
                margin: 0;
            }

            body.printing-detail .print-only-header p {
                font-size: 0.8rem !important;
                margin: 0;
            }

            body.printing-detail .detail-grid {
                display: grid;
                grid-template-columns: 1fr 1fr !important;
                /* Force 2 columns */
                gap: 15px !important;
            }

            body.printing-detail .detail-section {
                margin-bottom: 5px !important;
            }

            body.printing-detail .detail-section h4 {
                font-size: 0.75rem !important;
                margin-top: 5px !important;
                margin-bottom: 8px !important;
                padding-bottom: 2px !important;
            }

            body.printing-detail .detail-item {
                margin-bottom: 4px !important;
                padding-bottom: 2px !important;
                font-size: 0.7rem !important;
            }

            body.printing-detail .detail-label {
                font-size: 0.7rem !important;
            }

            body.printing-detail .detail-value {
                font-size: 0.7rem !important;
            }

            /* Case 2: Printing Summary Table */
            body:not(.printing-detail) #detailModal {
                display: none !important;
            }

            body:not(.printing-detail) #adminDashboard {
                display: block !important;
                padding: 1cm !important;
            }

            body:not(.printing-detail) .stats-grid {
                display: none !important;
            }

            body:not(.printing-detail) .table-container {
                box-shadow: none !important;
                border: none !important;
                overflow: visible !important;
            }

            body:not(.printing-detail) table {
                width: 100% !important;
                border: 1px solid #000 !important;
                font-size: 7.5pt !important;
            }

            body:not(.printing-detail) th,
            body:not(.printing-detail) td {
                border: 1px solid #000 !important;
                white-space: normal !important;
                padding: 5px !important;
            }

            body:not(.printing-detail) .btn-detail {
                display: none !important;
            }

            body:not(.printing-detail) th:first-child,
            body:not(.printing-detail) td:first-child {
                display: none !important;
            }

            /* Hide 'Aksi' */
        }

        @page {
            margin: 0;
        }

        /* Breakpoints */
        @media (max-width: 640px) {
            #adminDashboard {
                padding: 1rem;
            }

            header {
                flex-direction: column;
                text-align: center;
            }

            .controls {
                flex-direction: column;
            }

            .search-container {
                min-width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Login Area -->
    <div id="loginScreen">
        <div class="login-card">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🛡️</div>
            <h2>Admin Login</h2>
            <input type="password" id="passwordInput" placeholder="Masukkan Password Admin"
                onkeypress="handleEnter(event)">
            <button onclick="checkLogin()">MASUK DASHBOARD</button>
            <p id="loginError">Password salah!</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="adminDashboard">
        <header>
            <div class="header-title">
                <h1>Rekapitulasi PPDB</h1>
                <p>MI ISLAMADINA - Tahun Ajaran 2026/2027</p>
            </div>
            <button class="btn-print" onclick="window.print()">
                <span>📄</span> CETAK / EXPORT PDF
            </button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <h3 id="totalApplicants">0</h3>
                    <p>Total Pendaftar</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👦</div>
                <div class="stat-info">
                    <h3 id="totalLaki">0</h3>
                    <p>Laki-laki</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👧</div>
                <div class="stat-info">
                    <h3 id="totalPerempuan">0</h3>
                    <p>Perempuan</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Cari Nama atau NIK Siswa..." oninput="filterData()">
            </div>
        </div>

        <div class="table-container">
            <div id="tableLoader" class="table-loader">
                <div class="spinner"></div>
                <p>Sedang Mengambil Data dari Cloud...</p>
            </div>
            <table id="dataTable">
                <thead>
                    <tr id="tableHeader">
                        <th>AKSI</th>
                        <!-- Headers will be injected -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be injected -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal">
        <div class="modal-body">
            <div class="modal-header">
                <h3 id="modalTitle">Detail Calon Siswa</h3>
                <button class="btn-close-modal" onclick="closeModal()">×</button>
            </div>
            <div class="modal-content" id="modalContent">
                <div class="print-only-header">
                    <h2 style="margin-bottom:5px;">MI ISLAMADINA</h2>
                    <p>FORMULIR PENDAFTARAN PESERTA DIDIK BARU</p>
                    <p>TAHUN AJARAN 2026/2027</p>
                </div>
                <div id="detailView">
                    <!-- Detail Data Injected Here -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-print" onclick="printDetail()">
                    <span>📄</span> CETAK PDF SISWA
                </button>
                <button class="btn-print" onclick="closeModal()">TUTUP</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwtAPHCsrZAV3vSGn0rP9AvlqYUfHaZ5it6p7Tn4zScjRPa2ssscrDmmJQcaTFmbUMYEw/exec';
        let allData = [];

        function handleEnter(e) {
            if (e.key === 'Enter') checkLogin();
        }

        function checkLogin() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === 'bismilah') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                fetchData();
            } else {
                const err = document.getElementById('loginError');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 3000);
            }
        }

        async function fetchData() {
            const loader = document.getElementById('tableLoader');
            loader.style.display = 'block';

            try {
                // We add ?action=read to differentiate from POST if the script handles it
                // If the script only returns POST data, this fetch might fail unless doGet is implemented.
                // However, based on user requirements "Data real from Google Sheet", we proceed.
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error("Gagal mengambil data");

                const json = await response.json();

                // Usually Google Apps Script returns data in a 'data' array or directly
                allData = Array.isArray(json) ? json : (json.data || []);

                renderTable(allData);
                updateStats(allData);
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td colspan="20" style="text-align:center; padding: 2rem; color: var(--error);">
                            ❌ Gagal terhubung ke Google Sheets. Pastikan SCRIPT_URL sudah aktif (doGet implemented).
                            <br><small>${error.message}</small>
                        </td>
                    </tr>
                `;
            } finally {
                loader.style.display = 'none';
            }
        }

        function renderTable(data) {
            const headerRow = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="20" style="text-align:center;">Tidak ada data ditemukan.</td></tr>';
                return;
            }

            // Create Headers from Keys
            const keys = Object.keys(data[0]);
            headerRow.innerHTML = '<th>AKSI</th>' + keys.map(key => `<th>${key.replace(/_/g, ' ')}</th>`).join('');

            // Create Rows
            tbody.innerHTML = data.map((row, index) => {
                return `<tr>
                    <td><button class="btn-detail" onclick="showDetail(${index})">DETAIL</button></td>
                    ${keys.map(key => {
                    let val = row[key] || '-';
                    if (key === 'jenis_kelamin') {
                        const cls = val === 'L' ? 'badge-l' : 'badge-p';
                        const label = val === 'L' ? 'Laki-laki' : 'Perempuan';
                        return `<td><span class="badge ${cls}">${label}</span></td>`;
                    }
                    return `<td>${val}</td>`;
                }).join('')}
                </tr>`;
            }).join('');
        }

        function showDetail(index) {
            const student = allData[index];
            const detailView = document.getElementById('detailView');

            // Group data logically
            const sections = {
                "Identitas Siswa": ["nama_lengkap", "nik_siswa", "no_kk", "jenis_kelamin", "tgl_lahir", "tempat_lahir", "asal_sekolah"],
                "Data Fisik & Minat": ["berat_badan", "tinggi_badan", "bahasa", "hobi", "cita_cita"],
                "Data Ayah": ["nama_ayah", "nik_ayah", "pekerjaan_ayah", "pendidikan_ayah", "penghasilan_ayah", "nohp_ayah"],
                "Data Ibu": ["nama_ibu", "nik_ibu", "pekerjaan_ibu", "pendidikan_ibu", "penghasilan_ibu", "nohp_ibu"],
                "Data Wali": ["nama_wali", "nik_wali", "hubungan_wali", "pekerjaan_wali", "nohp_wali"],
                "Alamat & Kontak": ["alamat_lengkap", "transportasi", "jarak", "waktu_tempuh"]
            };

            let html = '<div class="detail-grid">';
            for (const [sectionTitle, fields] of Object.entries(sections)) {
                html += `<div class="detail-section">
                    <h4>${sectionTitle}</h4>`;
                fields.forEach(field => {
                    let label = field.replace(/_/g, ' ').toUpperCase();
                    let value = student[field] || '-';
                    if (field === 'jenis_kelamin') value = value === 'L' ? 'Laki-laki' : 'Perempuan';
                    html += `<div class="detail-item">
                        <span class="detail-label">${label}</span>
                        <span class="detail-value">${value}</span>
                    </div>`;
                });
                html += `</div>`;
            }
            html += '</div>';

            detailView.innerHTML = html;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function printDetail() {
            // Add class to body to trigger specific print CSS
            document.body.classList.add('printing-detail');
            window.print();
            // Remove class after print dialog closes
            setTimeout(() => {
                document.body.classList.remove('printing-detail');
            }, 500);
        }

        function updateStats(data) {
            document.getElementById('totalApplicants').innerText = data.length;
            const l = data.filter(r => r.jenis_kelamin === 'L').length;
            const p = data.filter(r => r.jenis_kelamin === 'P').length;
            document.getElementById('totalLaki').innerText = l;
            document.getElementById('totalPerempuan').innerText = p;
        }

        function filterData() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allData.filter(row => {
                const name = (row.nama_lengkap || '').toLowerCase();
                const nik = (row.nik_siswa || '').toString();
                return name.includes(term) || nik.includes(term);
            });
            renderTable(filtered);
        }
    </script>
</body>

</html>
